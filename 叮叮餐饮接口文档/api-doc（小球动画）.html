<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>叮叮餐饮管理端 API 文档 - 分类与员工</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css"
      id="hljs-light"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
      id="hljs-dark"
      disabled
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      /* ============================================================
         主题变量系统 - 从 theme.css 提取并适配文档场景
         ============================================================ */

      /* 浅色主题（默认）- 清新薄荷风 */
      :root {
        --bg-primary: #f0f7f4;
        --bg-card: #ffffff;
        --bg-card-hover: #f8fdf9;
        --text-primary: #1a3a2a;
        --text-secondary: #6b8f71;
        --text-disabled: #bdbdbd;
        --text-inverse: #ffffff;
        --border-color: #c8e6c9;
        --border-light: #e8f5e9;
        --border-dark: #a5d6a7;
        --primary: #4caf50;
        --primary-light: #81c784;
        --primary-lighter: #a5d6a7;
        --primary-dark: #388e3c;
        --primary-bg: #e8f5e9;
        --danger: #f44336;
        --danger-light: #ef5350;
        --danger-dark: #d32f2f;
        --danger-bg: #ffebee;
        --warning: #ff9800;
        --warning-light: #ffa726;
        --warning-dark: #f57c00;
        --warning-bg: #fff3e0;
        --info: #2196f3;
        --info-light: #42a5f5;
        --info-dark: #1976d2;
        --info-bg: #e3f2fd;
        --success: #4caf50;
        --success-light: #66bb6a;
        --success-dark: #388e3c;
        --success-bg: #e8f5e9;
        --accent-lime: #cddc39;
        --accent-mint: #00bcd4;
        --accent-moss: #8bc34a;
        --accent-teal: #26a69a;
        --neutral-100: #f5f5f5;
        --neutral-200: #eeeeee;
        --neutral-300: #e0e0e0;
        --neutral-400: #bdbdbd;
        --neutral-500: #9e9e9e;
        --neutral-600: #757575;
        --neutral-700: #616161;
        --neutral-800: #424242;
        --neutral-900: #212121;
        --shadow: 0 4px 20px 0 rgba(76, 175, 80, 0.15);
        --shadow-light: 0 2px 12px 0 rgba(76, 175, 80, 0.08);
        --shadow-heavy: 0 8px 32px 0 rgba(76, 175, 80, 0.2);
        --shadow-glow: 0 0 20px rgba(76, 175, 80, 0.3);
        --gradient-primary: linear-gradient(135deg, #4caf50 0%, #81c784 100%);
        --gradient-light: linear-gradient(135deg, #e8f5e9 0%, #f0f7f4 100%);
        --gradient-card: linear-gradient(135deg, #ffffff 0%, #f8fdf9 100%);

        /* 文档专用变量 */
        --doc-sidebar-bg: #ffffff;
        --doc-sidebar-border: #c8e6c9;
        --doc-sidebar-hover: #e8f5e9;
        --doc-sidebar-active: #4caf50;
        --doc-sidebar-active-text: #ffffff;
        --doc-content-bg: #f0f7f4;
        --doc-header-bg: #ffffff;
        --doc-glass-bg: rgba(255, 255, 255, 0.75);
        --doc-glass-bg-content: rgba(255, 255, 255, 0.85);
        --doc-module-bg: #f8fdf9;
        --doc-code-bg: #1e1e1e;
        --doc-code-border: #333;
        --doc-table-header-bg: #4caf50;
        --doc-table-header-text: #ffffff;
        --doc-table-row-bg: #ffffff;
        --doc-table-row-alt-bg: #f8fdf9;
        --doc-table-row-hover: #e8f5e9;
        --doc-table-border: #c8e6c9;
        --doc-badge-get: #4caf50;
        --doc-badge-post: #2196f3;
        --doc-badge-put: #ff9800;
        --doc-badge-delete: #f44336;
        --doc-search-bg: #f0f7f4;
        --doc-search-border: #c8e6c9;
        --doc-search-focus-border: #4caf50;
        --doc-btn-expand-bg: #e8f5e9;
        --doc-btn-expand-text: #388e3c;
        --doc-btn-expand-border: #a5d6a7;
        --doc-btn-collapse-bg: #fff3e0;
        --doc-btn-collapse-text: #f57c00;
        --doc-btn-collapse-border: #ffcc80;
        --doc-print-border: #333;
      }

      /* 深色主题 - 深邃夜空 */
      html.dark {
        --bg-primary: #1a1a2e;
        --bg-card: #16213e;
        --bg-card-hover: #1e2a4a;
        --text-primary: #e0e0e0;
        --text-secondary: #a0a0a0;
        --text-disabled: #616161;
        --text-inverse: #ffffff;
        --border-color: #2a2a4a;
        --border-light: #3a3a5a;
        --border-dark: #1a1a3a;
        --primary: #85ce61;
        --primary-light: #a8e063;
        --primary-lighter: #c8e6c9;
        --primary-dark: #67c23a;
        --primary-darker: #529b2e;
        --primary-bg: #1e3a1e;
        --danger: #f56c6c;
        --danger-light: #f78989;
        --danger-dark: #e04040;
        --danger-bg: #3d1f1f;
        --warning: #e6a23c;
        --warning-light: #ebb563;
        --warning-dark: #cf9236;
        --warning-bg: #3d2e1f;
        --info: #409eff;
        --info-light: #79bbff;
        --info-dark: #337ecc;
        --info-bg: #1e3a4a;
        --success: #67c23a;
        --success-light: #85ce61;
        --success-dark: #529b2e;
        --success-bg: #1e3a1e;
        --accent-lime: #cddc39;
        --accent-mint: #00bcd4;
        --accent-moss: #8bc34a;
        --accent-teal: #26a69a;
        --neutral-100: #212121;
        --neutral-200: #424242;
        --neutral-300: #616161;
        --neutral-400: #757575;
        --neutral-500: #9e9e9e;
        --neutral-600: #bdbdbd;
        --neutral-700: #e0e0e0;
        --neutral-800: #eeeeee;
        --neutral-900: #f5f5f5;
        --shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.3);
        --shadow-light: 0 2px 8px 0 rgba(0, 0, 0, 0.2);
        --shadow-heavy: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        --shadow-glow: 0 0 20px rgba(133, 206, 97, 0.15);
        --gradient-primary: linear-gradient(135deg, #67c23a 0%, #85ce61 100%);
        --gradient-light: linear-gradient(135deg, #1e3a1e 0%, #1a1a2e 100%);
        --gradient-card: linear-gradient(135deg, #16213e 0%, #1e2a4a 100%);

        /* 文档专用变量 - 深色 */
        --doc-sidebar-bg: #16213e;
        --doc-sidebar-border: #2a2a4a;
        --doc-sidebar-hover: #1e2a4a;
        --doc-sidebar-active: #67c23a;
        --doc-sidebar-active-text: #ffffff;
        --doc-content-bg: #1a1a2e;
        --doc-header-bg: #16213e;
        --doc-glass-bg: rgba(22, 33, 62, 0.75);
        --doc-glass-bg-content: rgba(22, 33, 62, 0.85);
        --doc-module-bg: #1a1a2e;
        --doc-code-bg: #0d1117;
        --doc-code-border: #2a2a4a;
        --doc-table-header-bg: #67c23a;
        --doc-table-header-text: #ffffff;
        --doc-table-row-bg: #16213e;
        --doc-table-row-alt-bg: #1a1a2e;
        --doc-table-row-hover: #1e3a1e;
        --doc-table-border: #2a2a4a;
        --doc-badge-get: #67c23a;
        --doc-badge-post: #409eff;
        --doc-badge-put: #e6a23c;
        --doc-badge-delete: #f56c6c;
        --doc-search-bg: #1a1a2e;
        --doc-search-border: #2a2a4a;
        --doc-search-focus-border: #85ce61;
        --doc-btn-expand-bg: #1e3a1e;
        --doc-btn-expand-text: #85ce61;
        --doc-btn-expand-border: #38a169;
        --doc-btn-collapse-bg: #3d2e1f;
        --doc-btn-collapse-text: #ebb563;
        --doc-btn-collapse-border: #8b6914;
        --doc-print-border: #555;
      }

      /* ============================================================
         全局基础样式
         ============================================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 14px;
        color: var(--text-primary);
        background: var(--bg-primary);
        transition:
          background 0.3s,
          color 0.3s;
        line-height: 1.6;
      }

      /* 滚动条样式 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 3px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* ============================================================
         背景动画
         ============================================================ */
      .bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        opacity: 1;
        transition: opacity 0.8s ease-in-out;
      }

      .bg-canvas.fade-out {
        opacity: 0;
      }

      /* ============================================================
         布局
         ============================================================ */
      .app-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        position: relative;
        z-index: 2;
      }

      /* 顶部导航栏 */
      .top-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 56px;
        padding: 0 24px;
        background: var(--doc-glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow: var(--shadow-light);
        z-index: 100;
        flex-shrink: 0;
        margin: 8px 8px 0 8px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-logo {
        width: 32px;
        height: 32px;
        background: var(--gradient-primary);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: bold;
        font-size: 16px;
      }

      .header-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .header-subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        margin-left: 8px;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      /* 主题切换按钮 */
      .theme-toggle {
        width: 40px;
        height: 40px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        background: var(--bg-card);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition: all 0.3s;
        color: var(--text-primary);
      }

      .theme-toggle:hover {
        border-color: var(--primary);
        box-shadow: var(--shadow-glow);
      }

      /* 顶栏图标按钮（PDF导出等） */
      .header-icon-btn {
        width: 40px;
        height: 40px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        background: var(--bg-card);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        transition: all 0.3s;
        color: var(--text-primary);
      }

      .header-icon-btn:hover {
        border-color: var(--primary);
        box-shadow: var(--shadow-glow);
      }

      .header-icon-btn.active {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
        box-shadow: var(--shadow-glow);
      }

      /* 主体区域 */
      .main-body {
        display: flex;
        flex: 1;
        overflow: hidden;
      }

      /* 侧边栏 */
      .sidebar {
        width: 280px;
        background: var(--doc-glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--doc-sidebar-border);
        border-radius: 12px;
        margin: 8px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow: hidden;
      }

      .sidebar-header {
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
      }

      /* 搜索框 */
      .search-box {
        position: relative;
        margin-bottom: 12px;
      }

      .search-box input {
        width: 100%;
        height: 36px;
        padding: 0 12px 0 36px;
        border: 1px solid var(--doc-search-border);
        border-radius: 8px;
        background: var(--doc-search-bg);
        color: var(--text-primary);
        font-size: 13px;
        outline: none;
        transition: border-color 0.3s;
      }

      .search-box input:focus {
        border-color: var(--doc-search-focus-border);
      }

      .search-box input::placeholder {
        color: var(--text-secondary);
      }

      .search-box .search-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        font-size: 14px;
        pointer-events: none;
      }

      /* 首页节点（侧边栏内） */
      .sidebar-home-node {
        display: flex;
        align-items: center;
        padding: 10px 16px;
        margin: 0 8px 8px 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        color: var(--text-primary);
        background: var(--primary-bg);
        border-radius: 8px;
        border: 1px solid var(--border-color);
        transition: all 0.2s;
        user-select: none;
      }

      .sidebar-home-node:hover {
        background: var(--primary-lighter);
        border-color: var(--primary);
      }

      .sidebar-home-node.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .home-node-icon {
        margin-right: 8px;
        font-size: 16px;
      }

      .home-node-text {
        flex: 1;
      }

      /* 展开/折叠按钮 */
      .sidebar-actions {
        display: flex;
        gap: 8px;
      }

      .sidebar-actions button {
        flex: 1;
        height: 30px;
        border: 1px solid;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
      }

      .btn-expand-all {
        background: var(--doc-btn-expand-bg);
        color: var(--doc-btn-expand-text);
        border-color: var(--doc-btn-expand-border);
      }

      .btn-expand-all:hover {
        filter: brightness(0.95);
      }

      .btn-collapse-all {
        background: var(--doc-btn-collapse-bg);
        color: var(--doc-btn-collapse-text);
        border-color: var(--doc-btn-collapse-border);
      }

      .btn-collapse-all:hover {
        filter: brightness(0.95);
      }

      /* 侧边栏内容 */
      .sidebar-content {
        flex: 1;
        overflow-y: auto;
        padding: 12px 0;
      }

      /* 模块分组 */
      .module-group {
        margin: 4px 8px;
        background: var(--doc-module-bg);
        border-radius: 8px;
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      .module-header {
        display: flex;
        align-items: center;
        padding: 8px 16px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        color: var(--text-primary);
        transition: background 0.2s;
        user-select: none;
      }

      .module-header:hover {
        background: var(--doc-sidebar-hover);
      }

      .module-header .arrow {
        margin-right: 8px;
        transition: transform 0.2s;
        font-size: 10px;
        color: var(--text-secondary);
      }

      .module-header.collapsed .arrow {
        transform: rotate(-90deg);
      }

      .module-header .module-icon {
        margin-right: 8px;
        font-size: 14px;
      }

      .module-children {
        overflow: hidden;
        transition: max-height 0.3s ease;
      }

      .module-children.collapsed {
        max-height: 0 !important;
      }

      /* 接口节点 */
      .api-node {
        display: flex;
        align-items: center;
        padding: 6px 16px 6px 40px;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-secondary);
        transition: all 0.2s;
        border-left: 3px solid transparent;
      }

      .api-node:hover {
        background: var(--doc-sidebar-hover);
        color: var(--text-primary);
      }

      .api-node.active {
        background: var(--primary-bg);
        color: var(--primary-dark);
        border-left-color: var(--primary);
        font-weight: 500;
      }

      .api-node .method-badge {
        display: inline-block;
        width: 36px;
        height: 18px;
        line-height: 18px;
        text-align: center;
        border-radius: 3px;
        font-size: 10px;
        font-weight: 700;
        color: #fff;
        margin-right: 8px;
        flex-shrink: 0;
      }

      .method-badge.get {
        background: var(--doc-badge-get);
      }

      .method-badge.post {
        background: var(--doc-badge-post);
      }

      .method-badge.put {
        background: var(--doc-badge-put);
      }

      .method-badge.delete {
        background: var(--doc-badge-delete);
      }

      .method-badge.err {
        background: var(--neutral-500);
      }

      .api-node .node-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* 内容区 */
      .content-area {
        flex: 1;
        overflow-y: auto;
        background: var(--doc-glass-bg-content);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 32px 40px;
      }

      .content-inner {
        max-width: 960px;
        margin: 0 auto;
      }

      /* 欢迎页 */
      .welcome-page {
        text-align: center;
        padding: 80px 20px;
      }

      .welcome-page h1 {
        font-size: 32px;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 16px;
      }

      .welcome-page p {
        color: var(--text-secondary);
        font-size: 16px;
        margin-bottom: 8px;
      }

      .welcome-page .modules-preview {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 32px;
        flex-wrap: wrap;
      }

      .welcome-page .module-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px 24px;
        box-shadow: var(--shadow-light);
        min-width: 180px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .welcome-page .module-card:hover {
        border-color: var(--primary);
        box-shadow: var(--shadow-glow);
        transform: translateY(-2px);
      }

      .welcome-page .module-card h3 {
        font-size: 16px;
        color: var(--text-primary);
        margin-bottom: 8px;
      }

      .welcome-page .module-card p {
        font-size: 13px;
        color: var(--text-secondary);
      }

      /* 错误码速查表 */
      .error-code-quick-ref {
        margin-top: 40px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 24px;
        box-shadow: var(--shadow-light);
      }

      .error-code-quick-ref h2 {
        font-size: 18px;
        color: var(--text-primary);
        margin-bottom: 16px;
      }

      .error-code-quick-ref .error-code-table {
        width: 100%;
        border-collapse: collapse;
      }

      .error-code-quick-ref .error-code-table th {
        background: var(--neutral-100);
        padding: 10px 16px;
        text-align: left;
        font-weight: 600;
        font-size: 13px;
        color: var(--text-secondary);
        border-bottom: 2px solid var(--border-color);
      }

      .error-code-quick-ref .error-code-table td {
        padding: 8px 16px;
        font-size: 13px;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-primary);
      }

      .error-code-quick-ref .error-code-table td code {
        background: var(--neutral-100);
        padding: 2px 8px;
        border-radius: 4px;
        font-family: "Courier New", monospace;
        font-size: 12px;
      }

      /* 接口详情 */
      @keyframes slideOutUp {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-20px);
        }
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .api-detail {
        display: none;
      }

      .api-detail.active {
        display: block;
        animation: slideInUp 0.3s ease-out;
      }

      .api-detail.exiting {
        display: block;
        animation: slideOutUp 0.2s ease-in forwards;
      }

      .api-detail-header {
        margin-bottom: 32px;
      }

        border-radius: 6px;
        padding: 6px 12px;
        color: var(--text-primary);

        background: var(--doc-badge-put);
      }

      .api-detail-header .api-method-badge.delete {
        background: var(--doc-badge-delete);
      }

      .api-detail-header .api-method-badge.err {
        background: var(--neutral-500);
      }

        font-size: 12px;
        color: var(--text-secondary);
        background: var(--neutral-100);
        padding: 4px 8px;
        border-radius: 4px;

        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 20px;
        box-shadow: var(--shadow-light);

        font-size: 16px;
        color: var(--text-primary);
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border-light);
      }

      /* 表格 */
      .param-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .param-table th {
        background: var(--doc-table-header-bg);
        color: var(--doc-table-header-text);
        padding: 10px 12px;
        text-align: left;
        font-weight: 600;
      }

      .param-table td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--doc-table-border);
        color: var(--text-primary);
      }

      .param-table tr:nth-child(even) {
        background: var(--doc-table-row-alt-bg);
      }

      .param-table tr:hover {
        background: var(--doc-table-row-hover);
      }

        font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
        background: var(--neutral-100);
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 12px;
        color: var(--primary-dark);
      }

      /* 代码块 */
      .code-block {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--doc-code-border);
        margin: 12px 0;
      }

      .code-block pre {
        margin: 0;
        padding: 16px;
        background: var(--doc-code-bg);
        overflow-x: auto;
      }

      .code-block code {
        font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
        font-size: 13px;
        line-height: 1.5;
      }

      .code-block .code-label {
        position: absolute;
        top: 8px;
        right: 12px;
        font-size: 11px;
        color: #888;
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 8px;
        border-radius: 4px;
      }

      /* 说明文本 */
      .note-text {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.8;
        margin-top: 8px;
      }

      .note-text strong {
        color: var(--text-primary);
      }

      .note-text ul {
        margin: 8px 0 8px 20px;
      }

      .note-text li {
        margin-bottom: 4px;
      }

      /* 错误码表 */
      .error-code-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

        color: var(--danger-dark);
        padding: 10px 12px;
        text-align: left;
        font-weight: 600;
      }

      .error-code-table td {

        color: var(--text-primary);
      }

        padding: 2px 6px;
        border-radius: 3px;
        font-size: 12px;
        color: var(--danger-dark);
      }

        }

        a[href^="http"]::after {
          content: " (" attr(href) ")";
          font-size: 11px;
          color: #666;

      // ============================================================
      // 展开/折叠模块
      // ============================================================
      function toggleModule(idx) {
        var header = document.querySelectorAll(".module-header")[idx];
        var children = document.getElementById("moduleChildren" + idx);

        if (header.classList.contains("collapsed")) {
          header.classList.remove("collapsed");
          children.classList.remove("collapsed");
          children.style.maxHeight = children.scrollHeight + "px";
        } else {
          header.classList.add("collapsed");
          children.classList.add("collapsed");
          children.style.maxHeight = "0px";
        }
      }

      function expandAll() {
        document.querySelectorAll(".module-header").forEach(function (h, i) {
          h.classList.remove("collapsed");
          var c = document.getElementById("moduleChildren" + i);
          c.classList.remove("collapsed");
          c.style.maxHeight = c.scrollHeight + "px";
        });
      }

      function collapseAll() {
        document.querySelectorAll(".module-header").forEach(function (h, i) {
          h.classList.add("collapsed");
          var c = document.getElementById("moduleChildren" + i);
          c.classList.add("collapsed");
          c.style.maxHeight = "0px";
        });
      }

      // ============================================================
      // 搜索
      // ============================================================
      function handleSearch(query) {
        query = query.trim().toLowerCase();
        var nodes = document.querySelectorAll(".api-node");
        var groups = document.querySelectorAll(".module-group");

        if (!query) {
          nodes.forEach(function (n) {
            n.style.display = "";
          });
          groups.forEach(function (g) {
            g.style.display = "";
          });
          return;
        }

        groups.forEach(function (g) {
          var mIdx = parseInt(g.dataset.module);
          var mod = apiData.modules[mIdx];
          var hasVisible = false;

          // 搜索模块名
          if (mod.name.toLowerCase().includes(query)) {
            hasVisible = true;
          }

          // 搜索接口
          g.querySelectorAll(".api-node").forEach(function (n) {
            var text = n.querySelector(".node-text").textContent.toLowerCase();
            var path = "";
            var api = mod.apis.find(function (a) {
              return a.id === n.dataset.id;
            });
            if (api) path = api.path.toLowerCase();

            if (text.includes(query) || path.includes(query)) {
              n.style.display = "";
              hasVisible = true;
            } else {
              n.style.display = "none";
            }
          });

          g.style.display = hasVisible ? "" : "none";

          if (hasVisible && query) {
            var header = g.querySelector(".module-header");
            var children = g.querySelector(".module-children");
            header.classList.remove("collapsed");
            children.classList.remove("collapsed");
            children.style.maxHeight = children.scrollHeight + "px";
          }
        });
      }

      // ============================================================
      // 显示接口详情
      // ============================================================
      function findApiById(id) {
        for (var m = 0; m < apiData.modules.length; m++) {
          for (var a = 0; a < apiData.modules[m].apis.length; a++) {
            if (apiData.modules[m].apis[a].id === id) {
              return apiData.modules[m].apis[a];
            }
          }
        }
        return null;
      }

      // 显示首页
      function showHome() {
        document.getElementById("welcomePage").style.display = "";
        document.getElementById("apiDetailContainer").style.display = "none";
        document.getElementById("apiDetailContainer").innerHTML = "";

        // 更新侧边栏激活状态
        document.querySelectorAll(".api-node").forEach(function (n) {
          n.classList.remove("active");
        });

        // 更新首页节点高亮
        document.querySelectorAll(".sidebar-home-node").forEach(function (n) {
          n.classList.add("active");
        });

        // 滚动到顶部
        document.getElementById("contentArea").scrollTop = 0;

        // 移动端关闭侧边栏
        if (window.innerWidth <= 768) {
          document.getElementById("sidebar").classList.remove("mobile-open");
        }
      }

      // 跳转到指定模块
      function showModule(moduleIdx) {
        var mod = apiData.modules[moduleIdx];
        if (!mod || !mod.apis || mod.apis.length === 0) return;

        // 展开该模块
        var header = document.querySelectorAll(".module-header")[moduleIdx];
        var children = document.getElementById("moduleChildren" + moduleIdx);
        if (header && children) {
          header.classList.remove("collapsed");
          children.classList.remove("collapsed");
          children.style.maxHeight = children.scrollHeight + "px";
        }

        // 显示该模块的第一个接口
        showApiDetail(mod.apis[0].id);
      }

      // 导出 PDF
      function exportPDF() {
        if (typeof html2pdf === "undefined") {
          alert("PDF 导出组件加载中，请稍后重试");
          return;
        }

        var btn = document.getElementById("pdfBtn");
        btn.disabled = true;
        btn.title = "导出中...";

        // 克隆内容区用于导出
        var contentClone = document
          .querySelector(".content-inner")
          .cloneNode(true);
        contentClone.style.width = "210mm";
        contentClone.style.padding = "20mm";
        contentClone.style.background = "#fff";
        contentClone.style.color = "#333";

        // 临时添加到 body
        var tempDiv = document.createElement("div");
        tempDiv.style.position = "absolute";
        tempDiv.style.left = "-9999px";
        tempDiv.style.top = "0";
        tempDiv.appendChild(contentClone);
        document.body.appendChild(tempDiv);

        var opt = {
          margin: [10, 10, 10, 10],
          filename: "叮叮餐饮管理端API文档.pdf",
          image: { type: "jpeg", quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true },
          jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
        };

        html2pdf()
          .set(opt)
          .from(tempDiv)
          .save()
          .then(function () {
            document.body.removeChild(tempDiv);
            btn.disabled = false;
            btn.title = "导出 PDF";
          })
          .catch(function (err) {
            console.error("PDF 导出失败:", err);
            document.body.removeChild(tempDiv);
            btn.disabled = false;
            btn.title = "导出 PDF";
            alert("PDF 导出失败，请查看控制台");
          });
      }

      function showApiDetail(id) {
        var api = findApiById(id);
        if (!api) return;

        // 更新侧边栏激活状态
        document.querySelectorAll(".api-node").forEach(function (n) {
          n.classList.toggle("active", n.dataset.id === id);
        });

        // 取消首页节点高亮
        document.querySelectorAll(".sidebar-home-node").forEach(function (n) {
          n.classList.remove("active");
        });

        // 隐藏欢迎页
        document.getElementById("welcomePage").style.display = "none";

        // 渲染详情（带动画）
        var container = document.getElementById("apiDetailContainer");
        var existingDetail = container.querySelector(".api-detail");

        if (existingDetail) {
          // 旧内容先淡出 + 滑出
          existingDetail.classList.remove("active");
          existingDetail.classList.add("exiting");
          setTimeout(function () {
            var html = buildApiDetailHtml(api);
            container.innerHTML = html;
            // 高亮代码
            if (window.hljs) {
              container.querySelectorAll("pre code").forEach(function (block) {
                hljs.highlightElement(block);
              });
            }
            // 滚动到顶部
            document.getElementById("contentArea").scrollTop = 0;
          }, 200);
        } else {
          var html = buildApiDetailHtml(api);
          container.innerHTML = html;
          container.style.display = "block";

          // 高亮代码
          if (window.hljs) {
            container.querySelectorAll("pre code").forEach(function (block) {
              hljs.highlightElement(block);
            });
          }

          // 滚动到顶部
          document.getElementById("contentArea").scrollTop = 0;
        }

        // 移动端关闭侧边栏
        if (window.innerWidth <= 768) {
          document.getElementById("sidebar").classList.remove("mobile-open");
        }
      }

      function buildApiDetailHtml(api) {
        var html = '<div class="api-detail active">';

        // 头部
        html += '<div class="api-detail-header">';
        html += "<h1>" + api.title + "</h1>";
        html += '<div class="api-meta">';
        html +=
          '<span class="api-method-badge ' +
          api.method.toLowerCase() +
          '">' +
          api.method +
          "</span>";
        html += '<span class="api-path">' + escapeHtml(api.path) + "</span>";
        if (api.contentType) {
          html +=
            '<span class="api-content-type">Content-Type: ' +
            escapeHtml(api.contentType) +
            "</span>";
        }
        html += "</div>";
        html += "</div>";

        // 描述
        if (api.description) {
          html += '<div class="detail-section">';
          html += "<h2>接口说明</h2>";
          html +=
            '<p class="note-text">' + escapeHtml(api.description) + "</p>";
          html += "</div>";
        }

        // ERR 类型：只显示错误码表和业务规则，跳过请求参数/请求体/响应体/cURL
        if (api.method === "ERR") {
          if (api.errorCodes && api.errorCodes.length > 0) {
            html += '<div class="detail-section">';
            html += "<h2>错误码列表</h2>";
            html += '<table class="error-code-table">';
            html +=
              "<thead><tr><th>错误码</th><th>说明</th><th>HTTP 状态码</th></tr></thead>";
            html += "<tbody>";
            api.errorCodes.forEach(function (e) {
              html += "<tr>";
              html += "<td><code>" + escapeHtml(e.code) + "</code></td>";
              html += "<td>" + escapeHtml(e.description) + "</td>";
              html += "<td>" + e.httpStatus + "</td>";
              html += "</tr>";
            });
            html += "</tbody></table></div>";
          }
          if (api.businessRules && api.businessRules.length > 0) {
            html += '<div class="detail-section">';
            html += "<h2>业务规则</h2>";
            html += '<div class="note-text"><ul>';
            api.businessRules.forEach(function (r) {
              html += "<li>" + escapeHtml(r) + "</li>";
            });
            html += "</ul></div></div>";
          }
          html += "</div>";
          return html;
        }

        // 请求参数
        if (api.requestParams && api.requestParams.length > 0) {
          html += '<div class="detail-section">';
          html += "<h2>请求参数</h2>";
          html += '<table class="param-table">';
          html +=
            "<thead><tr><th>参数名</th><th>类型</th><th>必填</th><th>位置</th><th>说明</th></tr></thead>";
          html += "<tbody>";
          api.requestParams.forEach(function (p) {
            var loc = p.location || "query";
            var locLabel =
              loc === "path"
                ? "路径"
                : loc === "query"
                  ? "查询"
                  : loc === "body"
                    ? "请求体"
                    : loc;
            html += "<tr>";
            html += "<td><code>" + escapeHtml(p.name) + "</code></td>";
            html += "<td><code>" + escapeHtml(p.type) + "</code></td>";
            html += "<td>" + escapeHtml(p.required) + "</td>";
            html += "<td>" + locLabel + "</td>";
            html += "<td>" + escapeHtml(p.description) + "</td>";
            html += "</tr>";
          });
          html += "</tbody></table></div>";
        }

        // 请求体
        if (api.requestBody) {
          html += '<div class="detail-section">';
          html += "<h2>请求体</h2>";
          html += '<div class="code-block">';

            "</span>";
          html +=
            '<pre><code class="language-typescript">' +
            escapeHtml(api.requestBody.code) +

          html += "</div></div>";

          html += '<div class="detail-section">';

          html += '<div class="code-block">';
          html +=
            '<span class="code-label">' +
            escapeHtml(api.responseBody.label) +
            "</span>";
          html +=
            '<pre><code class="language-json">' +
            escapeHtml(api.responseBody.code) +
            "</code></pre>";
          html += "</div></div>";

        // TypeScript 类型定义
        if (api.typescript) {
          html += '<div class="detail-section">';
          html += "<h2>TypeScript 类型定义</h2>";
          html += '<div class="code-block">';

            '<pre><code class="language-typescript">' +

          html += "</div></div>";

          html += '<div class="detail-section">';
          html += "<h2>业务错误码</h2>";
          html += '<table class="error-code-table">';

            html += "<tr>";

            html += "<td>" + escapeHtml(e.description) + "</td>";
            html += "<td>" + e.httpStatus + "</td>";

        // 业务规则

        // curl 示例

        html += "</div></div>";

        html += "</div>";
        return html;

      function buildCurlExample(api) {
        var method = api.method;
        var path = api.path.replace(/\{(\w+)\}/g, "<$1>");
        var url = "http://localhost:8080" + path;
        var cmd = "curl -X " + method;

        if (api.contentType) {
          cmd += ' \\\n  -H "Content-Type: ' + api.contentType + '"';
        }
        cmd += ' \\\n  -H "token: YOUR_TOKEN"';

        if (method === "POST" || method === "PUT") {
          if (api.requestBody) {
            // 提取接口中的 code 作为示例 body
            var bodyCode = api.requestBody.code;
            // 移除注释
            var cleanBody = bodyCode
              .replace(/\/\/.*/g, "")
              .replace(/\/\*[\s\S]*?\*\//g, "");
            cmd += " \\\n  -d '" + cleanBody.trim() + "'";
          }
        }

        cmd += ' \\\n  "' + url + '"';
        return cmd;
      }

      function escapeHtml(str) {
        var div = document.createElement("div");
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      // ============================================================
      // 主题切换
      // ============================================================
      function toggleTheme() {
        var html = document.documentElement;
        var btn = document.getElementById("themeBtn");
        var hljsLight = document.getElementById("hljs-light");
        var hljsDark = document.getElementById("hljs-dark");

        if (html.classList.contains("dark")) {
          html.classList.remove("dark");
          btn.innerHTML = "\u2600";
          hljsLight.disabled = false;
          hljsDark.disabled = true;
          localStorage.setItem("theme", "light");
        } else {
          html.classList.add("dark");
          btn.innerHTML = "\uD83C\uDF19";
          hljsLight.disabled = true;
          hljsDark.disabled = false;
          localStorage.setItem("theme", "dark");
        }

        // 重新高亮代码
        if (window.hljs) {
          document.querySelectorAll("pre code").forEach(function (block) {
            hljs.highlightElement(block);
          });
        }
      }

      // 初始化主题
      (function initTheme() {
        var saved = localStorage.getItem("theme");
        var btn = document.getElementById("themeBtn");
        var hljsLight = document.getElementById("hljs-light");
        var hljsDark = document.getElementById("hljs-dark");

        if (
          saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
          btn.innerHTML = "\uD83C\uDF19";
          hljsLight.disabled = true;
          hljsDark.disabled = false;
        }
      })();

      // 移动端侧边栏切换
      function toggleMobileSidebar() {
        document.getElementById("sidebar").classList.toggle("mobile-open");
      }

      // 点击内容区关闭移动端侧边栏
      document.addEventListener("DOMContentLoaded", function () {
        document
          .getElementById("contentArea")
          .addEventListener("click", function () {
            if (window.innerWidth <= 768) {
              document
                .getElementById("sidebar")
                .classList.remove("mobile-open");
            }
          });
      });

      // ============================================================
      // 背景动画 - 弹性碰撞小球
      // ============================================================

      // === 可配置参数 ===
      const BALL_CONFIG = {
        minCount: 15, // 最小球数量
        maxCount: 25, // 最大球数量
        minSize: 20, // 最小直径 (px)
        maxSize: 80, // 最大直径 (px)
        minSpeed: 0.3, // 最小速度
        maxSpeed: 1.2, // 最大速度
        baseOpacity: 0.5, // 基础透明度
        breatheSpeed: 0.008, // 呼吸速度（透明度变化速率）
        pauseChance: 0.002, // 每帧停顿概率（模拟呼吸节奏）
        pauseDuration: 60, // 停顿帧数
        collisionLoss: 0.05, // 碰撞能量损耗（5%）
        mouseRadius: 150, // 鼠标影响半径
        mouseForce: 0.8, // 鼠标排斥力强度
        acceleration: 0.02, // 加速度（启动/停止过渡）
        glowBlur: 15, // 发光模糊半径
        glowColor: "rgba(255,255,255,0.3)", // 发光颜色
      };

      // 浅色主题配色
      const LIGHT_COLORS = [
        "rgba(129, 199, 132, 0.85)", // 薄荷绿
        "rgba(100, 181, 246, 0.85)", // 浅蓝
        "rgba(179, 157, 219, 0.85)", // 淡紫
        "rgba(255, 183, 77, 0.85)", // 暖黄
        "rgba(240, 98, 146, 0.85)", // 粉红
        "rgba(128, 203, 196, 0.85)", // 青绿
      ];

      // 深色主题配色
      const DARK_COLORS = [
        "rgba(102, 187, 106, 0.7)", // 荧光绿
        "rgba(66, 165, 245, 0.7)", // 霓虹蓝
        "rgba(171, 71, 188, 0.7)", // 亮紫
        "rgba(255, 167, 38, 0.7)", // 亮橙
        "rgba(255, 82, 82, 0.7)", // 霓虹红
        "rgba(0, 229, 255, 0.7)", // 赛博青
      ];

      let bgAnimationId = null;
      let balls = [];
      let isBgAnimationRunning = false;

      class Ball {
        constructor(canvasWidth, canvasHeight, colors) {
          this.radius =
            BALL_CONFIG.minSize +
            Math.random() * (BALL_CONFIG.maxSize - BALL_CONFIG.minSize);
          this.x =
            this.radius + Math.random() * (canvasWidth - this.radius * 2);
          this.y =
            this.radius + Math.random() * (canvasHeight - this.radius * 2);

          // 大球更慢，小球更快（质量影响速度）
          const sizeRatio =
            (this.radius - BALL_CONFIG.minSize) /
            (BALL_CONFIG.maxSize - BALL_CONFIG.minSize);
          const speedRange = BALL_CONFIG.maxSpeed - BALL_CONFIG.minSpeed;
          const targetSpeed =
            BALL_CONFIG.maxSpeed - sizeRatio * speedRange * 0.5;
          const angle = Math.random() * Math.PI * 2;

          // 加速度系统：目标速度 vs 当前速度
          this.targetVx = Math.cos(angle) * targetSpeed;
          this.targetVy = Math.sin(angle) * targetSpeed;
          this.vx = 0;
          this.vy = 0;

          this.mass = this.radius * this.radius;

          // 呼吸效果
          this.breathePhase = Math.random() * Math.PI * 2;
          this.currentOpacity = BALL_CONFIG.baseOpacity;

          // 停顿机制（个体差异）
          this.isPaused = false;
          this.pauseTimer = 0;
          this.savedVx = 0;
          this.savedVy = 0;
          this.pauseChance = BALL_CONFIG.pauseChance * (0.5 + Math.random()); // 个体差异 ±50%

          // 颜色基础值
          const baseColor = colors[Math.floor(Math.random() * colors.length)];
          this.baseColor = baseColor;
          this.color = baseColor;

          // 解析 RGB 用于渐变
          const rgbaMatch = baseColor.match(/rgba\((\d+),\s*(\d+),\s*(\d+)/);
          if (rgbaMatch) {
            this.r = parseInt(rgbaMatch[1]);
            this.g = parseInt(rgbaMatch[2]);
            this.b = parseInt(rgbaMatch[3]);
          }
        }

        update(canvasWidth, canvasHeight, mouseX, mouseY) {
          // 呼吸效果：透明度正弦变化
          this.breathePhase += BALL_CONFIG.breatheSpeed;
          const breatheFactor = 0.3 + 0.3 * Math.sin(this.breathePhase);
          this.currentOpacity = BALL_CONFIG.baseOpacity * breatheFactor;

          // 更新颜色透明度
          this.color = `rgba(${this.r}, ${this.g}, ${this.b}, ${this.currentOpacity})`;

          // 停顿逻辑
          if (this.isPaused) {
            this.pauseTimer--;
            if (this.pauseTimer <= 0) {
              this.isPaused = false;
              this.targetVx = this.savedVx;
              this.targetVy = this.savedVy;
            }
            return;
          }

          // 随机停顿（个体差异）
          if (Math.random() < this.pauseChance) {
            this.isPaused = true;
            this.pauseTimer = BALL_CONFIG.pauseDuration;
            this.savedVx = this.targetVx;
            this.savedVy = this.targetVy;
            this.targetVx = 0;
            this.targetVy = 0;
            return;
          }

          // 鼠标交互：排斥力
          if (mouseX !== null && mouseY !== null) {
            const dx = this.x - mouseX;
            const dy = this.y - mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < BALL_CONFIG.mouseRadius && dist > 0) {
              const force =
                (1 - dist / BALL_CONFIG.mouseRadius) * BALL_CONFIG.mouseForce;
              this.targetVx += (dx / dist) * force;
              this.targetVy += (dy / dist) * force;
            }
          }

          // 加速度系统：平滑过渡到目标速度
          this.vx += (this.targetVx - this.vx) * BALL_CONFIG.acceleration;
          this.vy += (this.targetVy - this.vy) * BALL_CONFIG.acceleration;

          this.x += this.vx;
          this.y += this.vy;

          // 边界反弹
          if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.targetVx = Math.abs(this.targetVx);
          }
          if (this.x + this.radius > canvasWidth) {
            this.x = canvasWidth - this.radius;
            this.targetVx = -Math.abs(this.targetVx);
          }
          if (this.y - this.radius < 0) {
            this.y = this.radius;
            this.targetVy = Math.abs(this.targetVy);
          }
          if (this.y + this.radius > canvasHeight) {
            this.y = canvasHeight - this.radius;
            this.targetVy = -Math.abs(this.targetVy);
          }
        }

        draw(ctx) {
          // 发光效果
          ctx.shadowBlur = BALL_CONFIG.glowBlur;
          ctx.shadowColor = this.color;

          // 径向渐变
          const gradient = ctx.createRadialGradient(
            this.x - this.radius * 0.3,
            this.y - this.radius * 0.3,
            0,
            this.x,
            this.y,
            this.radius,
          );
          gradient.addColorStop(
            0,
            `rgba(255, 255, 255, ${this.currentOpacity * 0.8})`,
          );
          gradient.addColorStop(
            0.4,
            `rgba(${this.r}, ${this.g}, ${this.b}, ${this.currentOpacity * 0.6})`,
          );
          gradient.addColorStop(
            1,
            `rgba(${this.r}, ${this.g}, ${this.b}, ${this.currentOpacity * 0.2})`,
          );

          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();
          ctx.closePath();

          // 重置阴影
          ctx.shadowBlur = 0;
        }
      }

      // 弹性碰撞（动量守恒 + 能量损耗）
      function resolveCollision(ball1, ball2) {
        const dx = ball2.x - ball1.x;
        const dy = ball2.y - ball1.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < ball1.radius + ball2.radius) {
          // 碰撞法线
          const nx = dx / distance;
          const ny = dy / distance;

          // 相对速度
          const dvx = ball1.targetVx - ball2.targetVx;
          const dvy = ball1.targetVy - ball2.targetVy;
          const dvn = dvx * nx + dvy * ny;

          // 只在球靠近时处理碰撞
          if (dvn > 0) {
            const massSum = ball1.mass + ball2.mass;
            const impulse = (2 * dvn) / massSum;

            ball1.targetVx -= impulse * ball2.mass * nx;
            ball1.targetVy -= impulse * ball2.mass * ny;
            ball2.targetVx += impulse * ball1.mass * nx;
            ball2.targetVy += impulse * ball1.mass * ny;

            // 碰撞能量损耗
            const loss = BALL_CONFIG.collisionLoss;
            ball1.targetVx *= 1 - loss;
            ball1.targetVy *= 1 - loss;
            ball2.targetVx *= 1 - loss;
            ball2.targetVy *= 1 - loss;

            // 分离重叠
            const overlap = (ball1.radius + ball2.radius - distance) / 2;
            ball1.x -= overlap * nx;
            ball1.y -= overlap * ny;
            ball2.x += overlap * nx;
            ball2.y += overlap * ny;
          }
        }
      }

      let mouseX = null;
      let mouseY = null;

      function initBalls() {
        const canvas = document.getElementById("bgCanvas");
        const ctx = canvas.getContext("2d");
        const isDark = document.body.classList.contains("dark");
        const colors = isDark ? DARK_COLORS : LIGHT_COLORS;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const count =
          BALL_CONFIG.minCount +
          Math.floor(
            Math.random() * (BALL_CONFIG.maxCount - BALL_CONFIG.minCount + 1),
          );
        balls = [];
        for (let i = 0; i < count; i++) {
          balls.push(new Ball(canvas.width, canvas.height, colors));
        }
      }

      function animateBalls() {
        const canvas = document.getElementById("bgCanvas");
        const ctx = canvas.getContext("2d");

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 更新位置（传入鼠标位置）
        for (const ball of balls) {
          ball.update(canvas.width, canvas.height, mouseX, mouseY);
        }

        // 碰撞检测
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            resolveCollision(balls[i], balls[j]);
          }
        }

        // 绘制
        for (const ball of balls) {
          ball.draw(ctx);
        }

        bgAnimationId = requestAnimationFrame(animateBalls);
      }

      function startBgAnimation() {
        if (isBgAnimationRunning) return;

        const canvas = document.getElementById("bgCanvas");

        // 淡入效果
        canvas.classList.remove("fade-out");

        initBalls();
        animateBalls();
        isBgAnimationRunning = true;

        // 更新按钮状态
        const btn = document.getElementById("bgAnimBtn");
        if (btn) btn.classList.add("active");
      }

      function stopBgAnimation() {
        if (!isBgAnimationRunning) return;

        const canvas = document.getElementById("bgCanvas");

        // 淡出效果
        canvas.classList.add("fade-out");

        // 等待动画结束后停止
        setTimeout(() => {
          if (bgAnimationId) {
            cancelAnimationFrame(bgAnimationId);
            bgAnimationId = null;
          }
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          balls = [];
          isBgAnimationRunning = false;

          // 更新按钮状态
          const btn = document.getElementById("bgAnimBtn");
          if (btn) btn.classList.remove("active");
        }, 800);
      }

      function toggleBgAnimation() {
        if (isBgAnimationRunning) {
          stopBgAnimation();
        } else {
          startBgAnimation();
        }
      }

      // 监听主题切换，重新生成小球颜色
      const originalToggleTheme = window.toggleTheme;
      window.toggleTheme = function () {
        if (originalToggleTheme) originalToggleTheme();
        if (isBgAnimationRunning) {
          // 直接重新初始化小球，不需要停止再启动
          initBalls();
        }
      };

      // 监听窗口大小变化
      window.addEventListener("resize", () => {
        if (isBgAnimationRunning) {
          const canvas = document.getElementById("bgCanvas");
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
      });

      // 鼠标位置追踪
      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      document.addEventListener("mouseleave", () => {
        mouseX = null;
        mouseY = null;
      });

      // ============================================================
      // 初始化
      // ============================================================
      document.addEventListener("DOMContentLoaded", function () {
        renderSidebar(apiData);
        // 页面加载时自动启动背景动画
        startBgAnimation();
      });
    </script>
  </body>
</html>
